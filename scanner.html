<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>バーコード読み取り</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#172f55;padding:16px;font-size:22px;font-weight:bold}
.message,#result{margin:14px 12px;padding:16px;border-radius:14px}
.message{background:#27313e;font-size:17px;line-height:1.6}
#reader{margin:16px 12px;background:#000;border-radius:18px;overflow:hidden;min-height:360px}
#result{background:#153d2c;font-size:18px;line-height:1.5}
button{display:block;width:calc(100% - 24px);margin:14px 12px 24px;padding:17px;border:0;border-radius:14px;background:#edf2f8;color:#17324f;font-size:18px;font-weight:bold}
#startBtn{background:#fff}
</style>
</head>
<body>
<header>📷 バーコード読み取り</header>
<div class="message">商品バーコードを枠内に入れてください。<br>カメラが起動したら、バーコードを枠内に合わせてください。</div>
<div id="reader"></div>
<div id="result">カメラの準備中です…</div>
<button id="startBtn" onclick="start()">📷 カメラを起動</button>
<button id="stopBtn" onclick="stopScanner()">■ 読み取りを終了して戻る</button>
<script>
let scanner=null,done=false,starting=false;
const returnUrl=new URLSearchParams(location.search).get('returnUrl')||'';
function result(s,ok=true){const r=document.getElementById('result');r.innerHTML=s;r.style.background=ok?'#153d2c':'#3a2424'}
function goBack(barcode){
  if(!returnUrl){result('戻り先URLが指定されていません。<br>在庫管理画面からスキャナーを起動してください。',false);done=false;return}
  try{
    const u=new URL(returnUrl);
    if(barcode)u.searchParams.set('barcode',barcode);
    location.replace(u.toString());
  }catch(e){result('戻り先URLの処理に失敗しました。',false);done=false}
}
function success(t){
  if(done)return;
  done=true;
  const b=String(t).trim();
  result('読み取り成功：'+b+'<br>在庫管理画面へ戻ります…');
  if(scanner)scanner.stop().catch(()=>{});
  setTimeout(()=>goBack(b),250);
}
async function start(){
  if(starting||done)return;
  if(!returnUrl){result('戻り先URLがありません。GASの物販画面から起動してください。',false);return}
  if(!window.isSecureContext){result('安全な通信（HTTPS）で開いてください。',false);return}
  if(!window.Html5Qrcode){result('バーコード機能の読み込みに失敗しました。ページを再読み込みしてください。',false);return}
  starting=true;
  document.getElementById('startBtn').disabled=true;
  result('カメラを起動しています…');
  try{
    scanner=new Html5Qrcode('reader');
    const config={
      fps:10,
      qrbox:{width:280,height:130},
      aspectRatio:1.7777778,
      formatsToSupport:[
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E
      ]
    };
    let cameraId=null;
    try{
      const cameras=await Html5Qrcode.getCameras();
      if(cameras&&cameras.length){
        const back=cameras.find(c=>/back|rear|environment|背面|後面/i.test(c.label||''));
        cameraId=(back||cameras[cameras.length-1]).id;
      }
    }catch(e){}
    if(cameraId){
      await scanner.start(cameraId,config,success,()=>{});
    }else{
      await scanner.start({facingMode:'environment'},config,success,()=>{});
    }
    result('カメラ起動中です。バーコードを枠内に入れてください。');
  }catch(e){
    console.error(e);
    try{if(scanner)await scanner.clear();}catch(x){}
    scanner=null;
    result('カメラを起動できませんでした。<br>①ブラウザのカメラ許可を「許可」にする<br>②ページを再読み込みする<br>③それでもダメなら「戻る」を押してください。',false);
    document.getElementById('startBtn').disabled=false;
  }finally{starting=false}
}
async function stopScanner(){
  if(done)return;
  done=true;
  if(scanner){try{await scanner.stop()}catch(e){}try{await scanner.clear()}catch(e){}}
  result('在庫管理画面へ戻ります…');
  setTimeout(()=>goBack(''),150);
}
window.addEventListener('load',()=>{
  if(!returnUrl)result('戻り先URLがありません。物販画面から起動してください。',false);
  else result('「カメラを起動」を押してください。');
});
</script>
</body>
</html>

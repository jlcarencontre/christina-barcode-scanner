<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>バーコード読み取り</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.top{padding:16px 18px;font-size:20px;font-weight:800;background:#172b4d}.wrap{padding:16px;max-width:760px;margin:auto}.guide{padding:14px;border-radius:12px;background:#202b37;margin-bottom:14px;line-height:1.6}.reader{width:100%;min-height:320px;background:#000;border-radius:16px;overflow:hidden}.result{margin-top:14px;padding:14px;background:#173d2a;border-radius:12px;font-size:18px}.btn{width:100%;border:0;border-radius:12px;padding:16px;margin-top:12px;font-size:18px;font-weight:800}.stop{background:#e8eef4;color:#17324a}
</style></head>
<body><div class="top">📷 バーコード読み取り</div><div class="wrap"><div class="guide">商品バーコードを枠内に入れてください。<br>認識すると自動的に在庫管理画面へ戻ります。</div><div id="reader" class="reader"></div><div id="result" class="result" style="display:none"></div><button class="btn stop" onclick="stopAndBack()">読み取りを終了</button></div>
<script>
let scanner;const params=new URLSearchParams(location.search);const returnUrl=params.get('returnUrl');
function goBack(code){try{const u=new URL(returnUrl);u.searchParams.set('barcode',code);location.href=u.toString();}catch(e){document.getElementById('result').style.display='block';document.getElementById('result').textContent='読み取り成功：'+code+'（戻り先URLが不正です）';}}
function onSuccess(decodedText){if(!/^\d{8,14}$/.test(decodedText))return;document.getElementById('result').style.display='block';document.getElementById('result').textContent='読み取り：'+decodedText; if(scanner){scanner.stop().catch(()=>{});} setTimeout(()=>goBack(decodedText),250);}
function onError(){ }
function start(){scanner=new Html5Qrcode('reader');scanner.start({facingMode:{exact:'environment'}},{fps:10,qrbox:{width:Math.min(520,window.innerWidth-70),height:140},aspectRatio:1.7778,formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E]},onSuccess,onError).catch(()=>scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:Math.min(520,window.innerWidth-70),height:140},formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.CODE_128]},onSuccess,onError).catch(e=>{document.getElementById('result').style.display='block';document.getElementById('result').textContent='カメラを起動できません。ブラウザのカメラ許可を確認してください。';}));}
function stopAndBack(){if(scanner)scanner.stop().catch(()=>{});history.back();} start();
</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>バーコード読み取り</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#172f55;padding:16px;font-size:22px;font-weight:bold}.message,#result{margin:14px 12px;padding:16px;border-radius:14px}.message{background:#27313e;font-size:17px;line-height:1.6}#reader{margin:16px 12px;background:#000;border-radius:18px;overflow:hidden;min-height:360px}#result{background:#153d2c;font-size:18px;line-height:1.5}button{display:block;width:calc(100% - 24px);margin:14px 12px 24px;padding:17px;border:0;border-radius:14px;background:#edf2f8;color:#17324f;font-size:18px;font-weight:bold}</style></head><body><header>📷 バーコード読み取り</header><div class="message">商品バーコードを枠内に入れてください。<br>認識すると自動的に在庫管理画面へ戻ります。</div><div id="reader"></div><div id="result">カメラを起動しています…</div><button onclick="stopScanner()">読み取りを終了</button><script>
let scanner=null,done=false;const returnUrl=new URLSearchParams(location.search).get('returnUrl');
function result(s,ok=true){const r=document.getElementById('result');r.innerHTML=s;r.style.background=ok?'#153d2c':'#3a2424'}
function go(b){if(!returnUrl){result('読み取り成功：'+b+'<br>戻り先URLが指定されていません。<br>在庫管理画面からスキャナーを起動してください。',false);done=false;return}try{const u=new URL(returnUrl);u.searchParams.set('barcode',b);location.replace(u.toString())}catch(e){result('戻り先URLの処理に失敗しました。',false);done=false}}
function success(t){if(done)return;done=true;const b=String(t).trim();result('読み取り成功：'+b+'<br>在庫管理画面へ戻ります…');if(scanner)scanner.stop().catch(()=>{});setTimeout(()=>go(b),300)}
async function start(){scanner=new Html5Qrcode('reader');const c={fps:10,qrbox:{width:280,height:130},formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E]};try{await scanner.start({facingMode:{exact:'environment'}},c,success,()=>{});result('カメラ起動中です。バーコードを枠内に入れてください。')}catch(e){try{await scanner.start({facingMode:'environment'},c,success,()=>{});result('カメラ起動中です。バーコードを枠内に入れてください.')}catch(e2){result('カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。',false)}}}
async function stopScanner(){if(scanner){try{await scanner.stop()}catch(e){}}if(returnUrl)location.replace(returnUrl);else location.replace('https://jlcarencontre.github.io/christina-barcode-scanner/')}
addEventListener('load',start);
</script></body></html>
